# nginx in front of the factory safety stack. Steps in docs/DEPLOY.md.
# Copy to /etc/nginx/sites-available/factory-safety and replace safety.example.com with the real domain.
# certbot --nginx then adds the HTTPS listener, the certificate and the HTTP → HTTPS redirect to this file.
#
# One domain for everything: the dashboard calls the API on the same origin (NEXT_PUBLIC_API_URL=https://<domain>),
# so there is no CORS, and over HTTP/2 the live event stream does not use up the browser's 6 connections per host.

upstream factory_safety_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream factory_safety_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name safety.example.com;

    # Camera MP4 uploads; the backend accepts up to 200 MB.
    client_max_body_size 210m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Worker-only endpoints. The worker reaches the backend inside Docker, never through here.
    location /api/internal/ {
        return 404;
    }

    # Server-Sent Events: pass each event through at once and keep the stream open.
    location = /api/events/stream {
        proxy_pass http://factory_safety_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://factory_safety_backend;
        # Stream uploads straight to the backend instead of spooling them to disk first.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://factory_safety_frontend;
    }
}
